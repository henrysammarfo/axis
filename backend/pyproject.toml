[project]
name = "axis-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.40.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "magic-admin>=2.5.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "web3>=6.15.0",
  "python-jose[cryptography]>=3.3.0",
  "slowapi>=0.1.9",
  "x402[evm]>=0.1.0",
]

[tool.vercel]
entrypoint = "main:app"
